<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Story Za Dully</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #050816;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    .box { max-width: 460px; margin: 0 auto; }
    h1 { font-size: 20px; text-align: center; }
    h2 { font-size: 16px; margin: 32px 0 12px; }
    label { display: block; margin: 16px 0 6px; font-size: 13px; color: #b8bdca; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333a55;
      background: #0d1226;
      color: #ffffff;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }
    textarea { min-height: 200px; resize: vertical; line-height: 1.5; }
    textarea.small { min-height: 110px; }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 52px; }
    #eye {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #ffffff;
      font-size: 20px;
      border-radius: 8px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
      font-size: 13px;
      color: #b8bdca;
    }
    .remember input { width: auto; margin: 0; }
    .counter { text-align: right; font-size: 12px; color: #8a91a8; margin-top: 4px; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #050816;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #status, #settingsStatus {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      white-space: pre-line;
    }
    #refresh {
      margin-top: 0;
      padding: 8px 14px;
      width: auto;
      font-size: 12px;
      background: #1a2140;
      color: #ffffff;
    }
    .head { display: flex; justify-content: space-between; align-items: center; }
    .head h2 { margin: 32px 0 12px; }
    .head button { margin-top: 20px; }
    .msg {
      background: #0d1226;
      border: 1px solid #333a55;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .msg .t { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .msg .b { font-size: 13px; color: #b8bdca; line-height: 1.5; white-space: pre-line; }
    .msg .d { font-size: 11px; color: #8a91a8; margin: 8px 0 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .stat {
      background: #050816;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }
    .stat .n { font-size: 18px; font-weight: bold; }
    .stat .l { font-size: 10px; color: #8a91a8; margin-top: 2px; }
    .del {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: transparent;
      border: 1px solid #5a2a35;
      color: #ff7b8a;
      font-size: 13px;
      border-radius: 8px;
    }
    #empty { text-align: center; color: #8a91a8; font-size: 13px; }
    .panel {
      background: #0d1226;
      border: 1px solid #333a55;
      border-radius: 12px;
      padding: 4px 14px 18px;
    }
    .panel input, .panel textarea, .panel select { background: #050816; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .row select { flex: 1; }
    .hint { font-size: 12px; color: #8a91a8; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tuma Notification</h1>

    <label>Password ya admin</label>
    <div class="pass-wrap">
      <input type="password" id="password" autocomplete="current-password">
      <button type="button" id="eye" aria-label="Onyesha password">👁</button>
    </div>
    <label class="remember">
      <input type="checkbox" id="remember">
      Nikumbuke kwenye simu hii
    </label>

    <label>Kichwa (title)</label>
    <input type="text" id="title" maxlength="100">

    <label>Ujumbe</label>
    <textarea id="body" maxlength="300"></textarea>
    <div class="counter"><span id="count">0</span>/300</div>

    <label>Link (si lazima)</label>
    <input type="text" id="url" placeholder="Acha tupu kufungua app">

    <button id="send">TUMA SASA</button>
    <div id="status"></div>

    <h2>Mipangilio ya Popup ya Uchaguzi</h2>
    <div class="panel">
      <label>Kichwa cha popup</label>
      <input type="text" id="setTitle" maxlength="120">

      <label>Maelezo ya popup</label>
      <textarea id="setText" class="small" maxlength="500"></textarea>
      <div class="counter"><span id="setCount">0</span>/500</div>

      <label>Muda wa kufunga uchaguzi</label>
      <div class="row">
        <input type="number" id="setAmount" min="1" step="1">
        <select id="setUnit">
          <option value="1">Dakika</option>
          <option value="60">Saa</option>
          <option value="1440">Siku</option>
        </select>
      </div>
      <div class="hint">
        Mfano: dakika 30, saa 1, saa 6, saa 24. Kikomo ni siku 30.
        Mabadiliko yanaanza kutumika msomaji anapofungua app mara nyingine.
      </div>

      <button type="button" id="saveSettings">HIFADHI MIPANGILIO</button>
      <div id="settingsStatus"></div>
    </div>

    <div class="head">
      <h2>Historia</h2>
      <button type="button" id="refresh">Sasisha</button>
    </div>
    <div id="history"><div id="empty">Weka password kuona historia.</div></div>
  </div>

  <script>
    const WORKER_URL = "https://dully-notify.dullyofficial2000.workers.dev";
    const PASS_KEY = "dullyAdminPass";

    const passInput = document.getElementById("password");
    const eyeBtn = document.getElementById("eye");
    const rememberBox = document.getElementById("remember");
    const bodyInput = document.getElementById("body");
    const sendBtn = document.getElementById("send");
    const statusBox = document.getElementById("status");
    const historyBox = document.getElementById("history");

    const setTitle = document.getElementById("setTitle");
    const setText = document.getElementById("setText");
    const setAmount = document.getElementById("setAmount");
    const setUnit = document.getElementById("setUnit");
    const saveSettingsBtn = document.getElementById("saveSettings");
    const settingsStatus = document.getElementById("settingsStatus");

    /* KUMBUKA PASSWORD */
    function savePass() {
      try {
        if (rememberBox.checked && passInput.value) {
          localStorage.setItem(PASS_KEY, passInput.value);
        } else {
          localStorage.removeItem(PASS_KEY);
        }
      } catch (e) {}
    }

    try {
      const saved = localStorage.getItem(PASS_KEY);
      if (saved) {
        passInput.value = saved;
        rememberBox.checked = true;
      }
    } catch (e) {}

    rememberBox.addEventListener("change", savePass);

    /* JICHO */
    eyeBtn.addEventListener("click", function () {
      const hidden = passInput.type === "password";
      passInput.type = hidden ? "text" : "password";
      eyeBtn.textContent = hidden ? "🙈" : "👁";
    });

    /* IDADI YA HERUFI */
    bodyInput.addEventListener("input", function () {
      document.getElementById("count").textContent = bodyInput.value.length;
    });

    setText.addEventListener("input", function () {
      document.getElementById("setCount").textContent = setText.value.length;
    });

    async function callWorker(path, payload) {
      const res = await fetch(WORKER_URL + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Hitilafu");
      return data;
    }

    function makeStat(num, label) {
      const s = document.createElement("div");
      s.className = "stat";
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = num;
      const l = document.createElement("div");
      l.className = "l";
      l.textContent = label;
      s.appendChild(n);
      s.appendChild(l);
      return s;
    }

    /* MIPANGILIO YA POPUP */
    let settingsLoaded = false;

    async function loadSettings() {
      const password = passInput.value;
      if (!password || settingsLoaded) return;

      try {
        const r = await callWorker("/getsettings", { password: password });
        const s = r.settings;

        setTitle.value = s.title;
        setText.value = s.text;
        document.getElementById("setCount").textContent = s.text.length;

        const m = s.lockMinutes;
        if (m % 1440 === 0) {
          setAmount.value = m / 1440;
          setUnit.value = "1440";
        } else if (m % 60 === 0) {
          setAmount.value = m / 60;
          setUnit.value = "60";
        } else {
          setAmount.value = m;
          setUnit.value = "1";
        }

        settingsLoaded = true;
      } catch (e) {
        settingsStatus.textContent = "Mipangilio: " + e.message;
      }
    }

    saveSettingsBtn.addEventListener("click", async function () {
      const password = passInput.value;
      const title = setTitle.value.trim();
      const text = setText.value.trim();
      const minutes = Math.round(
        parseFloat(setAmount.value) * parseInt(setUnit.value, 10)
      );

      if (!password) {
        settingsStatus.textContent = "Weka password juu kwanza.";
        return;
      }
      if (!title || !text) {
        settingsStatus.textContent = "Jaza kichwa na maelezo.";
        return;
      }
      if (!minutes || minutes < 1 || minutes > 43200) {
        settingsStatus.textContent = "Muda uwe dakika 1 hadi siku 30.";
        return;
      }

      saveSettingsBtn.disabled = true;
      settingsStatus.textContent = "Inahifadhi...";

      try {
        await callWorker("/savesettings", {
          password: password,
          title: title,
          text: text,
          lockMinutes: minutes
        });
        settingsStatus.textContent = "Imehifadhiwa ✅";
      } catch (e) {
        settingsStatus.textContent = "Hitilafu: " + e.message;
      }

      saveSettingsBtn.disabled = false;
    });

    /* FUTA UJUMBE */
    async function deleteMsg(id, title) {
      const sure = confirm(
        "Futa ujumbe huu?\n\n" + title +
        "\n\nHistoria na idadi zake zitafutwa kabisa."
      );
      if (!sure) return;

      try {
        await callWorker("/delete", {
          password: passInput.value,
          id: id
        });
        loadHistory();
      } catch (e) {
        alert("Imeshindwa kufuta: " + e.message);
      }
    }

    /* HISTORIA */
    async function loadHistory() {
      const password = passInput.value;
      if (!password) return;

      try {
        const r = await callWorker("/history", { password: password });
        savePass();
        loadSettings();
        historyBox.textContent = "";

        if (!r.messages.length) {
          const e = document.createElement("div");
          e.id = "empty";
          e.textContent = "Bado hakuna ujumbe uliotumwa.";
          historyBox.appendChild(e);
          return;
        }

        r.messages.forEach(function (m) {
          const card = document.createElement("div");
          card.className = "msg";

          const t = document.createElement("div");
          t.className = "t";
          t.textContent = m.title;

          const b = document.createElement("div");
          b.className = "b";
          b.textContent = m.body;

          const d = document.createElement("div");
          d.className = "d";
          d.textContent = m.createdAt
            ? new Date(m.createdAt).toLocaleString() : "";

          const stats = document.createElement("div");
          stats.className = "stats";
          stats.appendChild(makeStat(m.total, "Walengwa"));
          stats.appendChild(makeStat(m.sent, "Zimetumwa"));
          stats.appendChild(makeStat(m.delivered, "Zimefika"));
          stats.appendChild(makeStat(m.opened, "Wamefungua"));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "del";
          del.textContent = "🗑 Futa";
          del.addEventListener("click", function () {
            deleteMsg(m.id, m.title);
          });

          card.appendChild(t);
          card.appendChild(b);
          card.appendChild(d);
          card.appendChild(stats);
          card.appendChild(del);
          historyBox.appendChild(card);
        });
      } catch (e) {
        historyBox.textContent = "";
        const err = document.createElement("div");
        err.id = "empty";
        err.textContent = "Historia: " + e.message;
        historyBox.appendChild(err);
      }
    }

    document.getElementById("refresh")
      .addEventListener("click", loadHistory);

    passInput.addEventListener("change", function () {
      settingsLoaded = false;
      loadHistory();
    });

    /* Jisasishe kila sekunde 10 */
    setInterval(function () {
      if (!document.hidden) loadHistory();
    }, 10000);

    /* Fungua historia moja kwa moja kama password imekumbukwa */
    loadHistory();

    /* KUTUMA */
    sendBtn.addEventListener("click", async function () {
      const password = passInput.value;
      const title = document.getElementById("title").value.trim();
      const body = bodyInput.value.trim();
      const url = document.getElementById("url").value.trim();

      if (!password || !title || !body) {
        statusBox.textContent = "Jaza password, kichwa na ujumbe.";
        return;
      }

      sendBtn.disabled = true;

      const id = Math.random().toString(36).slice(2, 10) +
        Date.now().toString(36);

      let skip = 0;
      let sent = 0;
      let failed = 0;
      let ok = false;

      try {
        while (skip !== null) {
          statusBox.textContent = "Inatuma... (zimetumwa " + sent + ")";
          const payload = {
            password: password,
            title: title,
            body: body,
            skip: skip,
            id: id
          };
          if (url) payload.url = url;

          const r = await callWorker("/", payload);
          sent += r.sent;
          failed += r.failed;
          skip = r.next;
        }
        ok = true;
        statusBox.textContent =
          "Imekamilika ✅\nZimetumwa: " + sent + "\nZimeshindwa: " + failed;
      } catch (e) {
        statusBox.textContent = "Hitilafu: " + e.message;
      }

      if (ok) {
        document.getElementById("title").value = "";
        document.getElementById("url").value = "";
        bodyInput.value = "";
        document.getElementById("count").textContent = "0";
      }

      sendBtn.disabled = false;
      loadHistory();
    });
  </script>
</body>
</html>

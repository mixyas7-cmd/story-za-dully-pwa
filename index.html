
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">

  <title>Story Za Dully</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #050816;
    }

    /* SPLASH SCREEN */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(
        circle at center,
        #17213a 0%,
        #050816 75%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      transition: opacity .7s ease, visibility .7s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo {
      width: 155px;
      height: 155px;
      object-fit: contain;
      border-radius: 28px;
      filter:
        drop-shadow(0 0 12px rgba(231,184,92,.65))
        drop-shadow(0 0 28px rgba(231,184,92,.45))
        drop-shadow(0 0 48px rgba(231,184,92,.25));
      animation: logoGlow 2.5s ease-in-out infinite alternate;
    }

    .title {
      margin-top: 28px;
      color: #e7b85c;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      text-align: center;
      text-shadow: 0 0 15px rgba(231,184,92,.25);
    }

    @keyframes logoGlow {
      from {
        filter:
          drop-shadow(0 0 10px rgba(231,184,92,.45))
          drop-shadow(0 0 22px rgba(231,184,92,.25));
      }

      to {
        filter:
          drop-shadow(0 0 18px rgba(231,184,92,.8))
          drop-shadow(0 0 42px rgba(231,184,92,.5))
          drop-shadow(0 0 60px rgba(231,184,92,.25));
      }
    }

    /* INTERNET STATUS */
    #networkStatus {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      background: #c62828;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      white-space: nowrap;
      box-shadow: 0 4px 15px #0005;
    }

    /* TOAST MESSAGE */
    #toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translate(-50%, 20px);
      z-index: 10002;
      background: #292929;
      color: white;
      padding: 13px 22px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      transition: .25s ease;
      white-space: nowrap;
      box-shadow: 0 4px 15px #0005;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <img
      src="./icons/icon-512.png"
      class="logo"
      alt="Story Za Dully"
    >

    <div class="title">STORY ZA DULLY</div>
  </div>

  <!-- INTERNET STATUS -->
  <div id="networkStatus">
    No Internet Connection
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- BLOGGER WEBSITE -->
  <iframe
    id="blog"
    src="https://dullystory.blogspot.com/"
    title="Story Za Dully">
  </iframe>

  <script>
    // SERVICE WORKER
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function (error) {
            console.error("Service Worker:", error);
          });
      });
    }

    // SPLASH SCREEN
    const splash = document.getElementById("splash");
    const blog = document.getElementById("blog");

    function hideSplash() {
      splash.classList.add("hide");
    }

    blog.addEventListener("load", function () {
      setTimeout(hideSplash, 700);
    });

    // Fallback
    setTimeout(hideSplash, 10000);


    // TOAST MESSAGE
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, 2000);
    }


    // INTERNET CONNECTION
    const networkStatus =
      document.getElementById("networkStatus");

    function checkInternet() {
      if (!navigator.onLine) {
        networkStatus.textContent = "No Internet Connection";
        networkStatus.style.display = "block";
      } else {
        networkStatus.style.display = "none";
      }
    }

    window.addEventListener("offline", function () {
      networkStatus.textContent = "No Internet Connection";
      networkStatus.style.display = "block";
    });

    window.addEventListener("online", function () {
      networkStatus.style.display = "none";
      showToast("Internet Connection Restored");
    });

    checkInternet();


    // TAP AGAIN TO EXIT
    let lastBackPress = 0;

    history.pushState(
      { exitGuard: true },
      "",
      location.href
    );

    window.addEventListener("popstate", function () {
      const now = Date.now();

      if (now - lastBackPress < 2000) {
        lastBackPress = 0;

        // Allow normal Back navigation
        history.back();

      } else {
        lastBackPress = now;

        showToast("Tap again to exit");

        // Restore Back guard
        history.pushState(
          { exitGuard: true },
          "",
          location.href
        );
      }
    });
  </script>

</body>
  </html>

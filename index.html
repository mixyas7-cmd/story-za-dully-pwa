
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">

  <title>Story Za Dully</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-512.png">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: Arial, sans-serif;
    }

    #blog {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #050816;
    }

    /* SPLASH SCREEN */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050816;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity .4s ease, visibility .4s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo {
      width: 155px;
      height: 155px;
      object-fit: cover;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: none;
      filter: none;
      animation: none;
    }

    .title {
      margin-top: 22px;
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: none;
    }

    /* INTERNET STATUS */
    #networkStatus {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      background: #c62828;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      display: none;
      white-space: nowrap;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translate(-50%, 20px);
      z-index: 10002;
      background: #292929;
      color: white;
      padding: 13px 22px;
      border-radius: 25px;
      font-size: 14px;
      opacity: 0;
      visibility: hidden;
      transition: .25s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }
  </style>
</head>

<body>

  <div id="splash">
    <img
      src="./icons/icon-512.png"
      class="logo"
      alt="Story Za Dully"
    >
    <div class="title">STORY ZA DULLY</div>
  </div>

  <div id="networkStatus">No Internet Connection</div>
  <div id="toast"></div>

  <iframe
    id="blog"
    src="https://dullystory.blogspot.com/"
    title="Story Za Dully">
  </iframe>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(function (error) {
            console.error("Service Worker:", error);
          });
      });
    }

    const splash = document.getElementById("splash");
    const blog = document.getElementById("blog");

    function hideSplash() {
      splash.classList.add("hide");
    }

    blog.addEventListener("load", function () {
      setTimeout(hideSplash, 500);
    });

    setTimeout(hideSplash, 10000);

    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, 2000);
    }

    const networkStatus =
      document.getElementById("networkStatus");

    function checkInternet() {
      networkStatus.style.display =
        navigator.onLine ? "none" : "block";
    }

    window.addEventListener("offline", function () {
      networkStatus.style.display = "block";
    });

    window.addEventListener("online", function () {
      networkStatus.style.display = "none";
      showToast("Internet Connection Restored");
    });

    checkInternet();

    let lastBackPress = 0;

    history.pushState({ exitGuard: true }, "", location.href);

    window.addEventListener("popstate", function () {
      const now = Date.now();

      if (now - lastBackPress < 2000) {
        lastBackPress = 0;
        history.back();
      } else {
        lastBackPress = now;
        showToast("Tap again to exit");
        history.pushState({ exitGuard: true }, "", location.href);
      }
    });
  </script>

</body>
</html>
